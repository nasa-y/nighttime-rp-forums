<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — NightTime RP Forums</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">NT</div>
        NightTime RP
      </a>
      <div class="nav-links">
        <a href="index.html">Forums</a>
        <a href="category.html?id=3">LSPD</a>
        <a href="category.html?id=4">EMS</a>
        <a href="category.html?id=5">Gangs</a>
        <a href="category.html?id=6">Civilians</a>
      </div>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Forums</a>
      <span class="sep">&rsaquo;</span>
      <span>Category</span>
    </div>

    <div class="main-content">
      <div>
        <div class="new-thread-bar">
          <h2 style="font-size:1.2rem;font-weight:700;">Category Threads</h2>
          <button class="btn btn-primary btn-sm" onclick="alert('Create a thread — login required!')">+ New Thread</button>
        </div>
        <div class="thread-list" id="thread-list"></div>

        <div class="pagination">
          <button>&larr; Prev</button>
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>Next &rarr;</button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-card">
          <div id="server-status"></div>
        </div>

        <div class="sidebar-card">
          <h3>🟢 Online Now</h3>
          <div class="online-users" id="online-users"></div>
        </div>

        <div class="sidebar-card">
          <h3>📊 Stats</h3>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:0.8rem;">
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Threads</span>
              <span style="font-weight:600">1,459</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Posts</span>
              <span style="font-weight:600">15,109</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Members</span>
              <span style="font-weight:600">892</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <footer class="footer">
    <p>NightTime RP &copy; 2026 — FiveM Roleplay Server</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
