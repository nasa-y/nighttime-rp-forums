<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — NightTime RP Forums</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="stars"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">🌙</div>
        NightTime RP
      </a>
      <div class="nav-links">
        <a href="index.html">Forums</a>
        <a href="category.html?id=3">Roleplay</a>
        <a href="category.html?id=5">Events</a>
        <a href="category.html?id=4">Lore</a>
      </div>
      <div class="nav-actions">
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search forums...">
        </div>
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Forums</a>
      <span class="sep">›</span>
      <span>General Discussion</span>
    </div>

    <div class="main-content">
      <div>
        <div class="new-thread-bar">
          <h2 style="font-size:1.25rem;font-weight:700;">General Discussion</h2>
          <button class="btn btn-primary btn-sm" onclick="alert('Create thread feature — connect a backend to enable!')">+ New Thread</button>
        </div>
        <div class="thread-list" id="thread-list"></div>

        <div class="pagination">
          <button>← Prev</button>
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>Next →</button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-card">
          <h3>🟢 Online Now</h3>
          <div class="online-users" id="online-users"></div>
        </div>

        <div class="sidebar-card">
          <h3>📊 Category Stats</h3>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:0.85rem;">
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Threads</span>
              <span style="font-weight:600">342</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Posts</span>
              <span style="font-weight:600">4,821</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="color:var(--text-muted)">Latest poster</span>
              <span style="color:var(--accent-light)">NightWalker</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <footer class="footer">
    <p>NightTime RP Forums &copy; 2026 — Where shadows tell stories.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
