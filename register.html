<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — NightTime RP Forums</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="stars"></div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">🌙</div>
        NightTime RP
      </a>
      <div class="nav-links">
        <a href="index.html">Forums</a>
        <a href="category.html?id=3">Roleplay</a>
        <a href="category.html?id=5">Events</a>
        <a href="category.html?id=4">Lore</a>
      </div>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Join the Night</h1>
      <p class="subtitle">Create your NightTime RP account</p>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Username</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" class="form-input" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Create a password (min 8 characters)" required minlength="8">
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-input" placeholder="Confirm your password" required>
        </div>
        <div style="margin-bottom:1.25rem;">
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:0.8rem;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" required style="accent-color:var(--accent);margin-top:3px">
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Community Rules</a></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
      </form>

      <div class="auth-divider">or sign up with</div>

      <div style="display:flex;gap:0.75rem;">
        <button class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="alert('Discord OAuth coming soon!')">
          💬 Discord
        </button>
        <button class="btn btn-secondary" style="flex:1;justify-content:center;" onclick="alert('GitHub OAuth coming soon!')">
          🐙 GitHub
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
